{
  "enabled": true,
  "port": 8011,
  "baseUrl": "http://localhost:8011",
  "endpoints": {
    "crawl": "POST /api/v1/crawl",
    "jobs": "GET /api/v1/jobs",
    "job": "GET /api/v1/jobs/:id",
    "results": "GET /api/v1/jobs/:id/results",
    "export": "GET /api/v1/jobs/:id/export/:format",
    "stop": "POST /api/v1/jobs/:id/stop",
    "status": "GET /api/v1/status"
  },
  "authentication": {
    "enabled": true,
    "method": "bearer_token",
    "header": "Authorization",
    "env_variable": "API_TOKEN"
  },
  "rateLimit": {
    "enabled": true,
    "windowMs": 60000,
    "maxRequests": 100
  },
  "cors": {
    "enabled": true,
    "origins": ["http://localhost:8010", "http://localhost:8011"],
    "credentials": true
  },
  "documentation": {
    "enabled": true,
    "path": "/api/docs",
    "format": "swagger"
  },
  "_comment": "REST API for remote crawl job management, result retrieval, and export. Requires API_TOKEN for authentication.",
  "_examples": {
    "create_job": "curl -X POST http://localhost:8011/api/v1/crawl -H 'Authorization: Bearer YOUR_TOKEN' -H 'Content-Type: application/json' -d '{\"url\":\"https://example.com\",\"depth\":3,\"maxPages\":50}'",
    "get_results": "curl http://localhost:8011/api/v1/jobs/job-id/results -H 'Authorization: Bearer YOUR_TOKEN'",
    "export_csv": "curl http://localhost:8011/api/v1/jobs/job-id/export/csv -H 'Authorization: Bearer YOUR_TOKEN' > results.csv"
  }
}
