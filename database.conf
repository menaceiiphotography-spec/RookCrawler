# SQLite Database Configuration
# Persistent storage for crawl results and crawler history

[database]
# Database file path (relative to project root)
path = "./rook-crawler.db"

# Enable persistence (true/false)
enabled = true

# Maximum results to keep in database (0 = unlimited)
max_results = 100000

# Auto-cleanup: days to keep results (0 = keep forever)
retention_days = 90

# Vacuum database on startup (true/false)
auto_vacuum = true

# WAL mode for better concurrency
wal_mode = true

[tables]
# Automatically create tables on startup
auto_create = true

# Tables to create:
# - crawls: Crawl job history and metadata
# - results: Crawl results with content, URL, fingerprint
# - errors: Error logs with status codes and reasons
# - sessions: Persistent session data for cookies
